name: Browser QA (Playwright + Lighthouse)
on:
  pull_request:
  workflow_dispatch:
jobs:
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Instalar ferramentas de QA sem alterar lockfile
        run: npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.56.1 lighthouse@12
      - name: Instalar navegadores Chromium, Firefox e WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - name: Executar testes de navegador
        run: npx playwright test
      - name: Lighthouse mobile e desktop
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p qa-artifacts
          npm run start -- -H 127.0.0.1 -p 3000 >/tmp/next-qa.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then break; fi
            sleep 2
          done
          export CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          npx lighthouse http://127.0.0.1:3000 --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=html --output=json --output-path=qa-artifacts/lighthouse-mobile --quiet
          npx lighthouse http://127.0.0.1:3000 --preset=desktop --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=html --output=json --output-path=qa-artifacts/lighthouse-desktop --quiet
          node scripts/lighthouse-summary.cjs
      - name: Salvar screenshots e relatórios
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-qa-reports
          path: |
            playwright-report/
            test-results/
            qa-artifacts/
          retention-days: 14
