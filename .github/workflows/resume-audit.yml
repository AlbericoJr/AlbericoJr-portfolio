name: Auditoria pontual do currículo
on:
  push:
    branches: [feat/modernizacao-portfolio-2026]
jobs:
  resume:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Preparar ferramentas locais de PDF
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Validar PDF e conferir referências de currículo
        shell: bash
        run: |
          pdfinfo "public/Albérico_Jr.pdf" | grep -E '^(Pages|CreationDate|ModDate|Page size):'
          pdftotext -layout "public/Albérico_Jr.pdf" /tmp/curriculo.txt
          node - <<'NODE'
          const fs=require('fs')
          const text=fs.readFileSync('/tmp/curriculo.txt','utf8').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').toLowerCase()
          console.log('Conteúdo textual extraído:', text.length>300 ? 'sim':'insuficiente')
          for(const [label,query] of Object.entries({
            'UNINASSAU':'uninassau',
            'Atesteme':'atesteme',
            'UNIFG':'unifg',
            'Gestão de RH':'recursos humanos',
            'React':'react',
            'React Native':'react native',
            '2025': '2025',
            '2026': '2026'
          }))console.log(label+': '+(text.includes(query)?'presente':'não localizado'))
          const years=[...new Set(text.match(/\b20(?:1\d|2\d)\b/g)||[])]
          console.log('Anos citados:',years.sort().join(', ')||'nenhum')
          if(text.length<200)process.exitCode=1
          NODE
