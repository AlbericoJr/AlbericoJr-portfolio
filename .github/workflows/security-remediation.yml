name: Correção temporária de dependências
on:
  push:
    branches: [feat/modernizacao-portfolio-2026]
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Aplicar atualizações compatíveis de segurança
        run: npm audit fix --no-fund || true
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Nova auditoria de produção
        run: npm audit --omit=dev --audit-level=high || true
      - name: Salvar lockfile corrigido
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): apply compatible security updates [skip ci]"
            git push origin HEAD:feat/modernizacao-portfolio-2026
          fi
