name: Gerar lockfile na migração Next 16

on:
  push:
    branches:
      - chore/upgrade-next16-2026

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Resolver e atualizar lockfile
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Confirmar que lockfile funciona
        run: npm ci
      - name: Executar lint
        run: npm run lint
      - name: Executar testes
        run: npm test
      - name: Executar build
        run: npm run build
      - name: Salvar lockfile na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualizar package-lock para Next.js 16 [skip ci]"
            git push origin HEAD:chore/upgrade-next16-2026
          fi
